<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า | Body Scent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <a class="brand" href="index.html">BODY SCENT</a>
    <nav class="site-nav" aria-label="เมนูหลัก">
      <a href="index.html">หน้าแรก</a>
      <a href="product.html">สินค้า</a>
    </nav>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="text-center" style="margin-bottom: var(--space-5);">
          <h1 style="font-size: clamp(2rem, 5vw, 3rem);">สั่งซื้อสินค้า</h1>
          <p>กรอกข้อมูลของคุณ แล้วเราจะติดต่อกลับเพื่อยืนยันคำสั่งซื้อ</p>
        </div>

        <form id="orderForm">
          <div class="form-group">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="form-group">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" autocomplete="tel" required>
          </div>

          <div class="form-group">
            <label for="items">รายการสินค้า</label>
            <input type="text" id="items" name="items" required>
          </div>

          <div class="form-group">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="text" id="total" name="total" inputmode="numeric" required>
          </div>

          <div class="form-group">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note"></textarea>
          </div>

          <button type="submit" class="btn btn--accent btn--block">ยืนยันสั่งซื้อ</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p style="margin-inline:auto;">&copy; Body Scent</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
